<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Video MKV · Configuración</title><link rel="stylesheet" href="options.css"></head><body><main><header><div><h1>⚙️ Video MKV Downloader</h1><p>Configuración del motor local FFmpeg desde Chrome</p></div><span id="state" class="badge">Comprobando…</span></header>
<section class="card"><h2>Motor multimedia</h2><div class="form"><label>ffmpeg.exe<input id="ffmpeg"></label><label>ffprobe.exe<input id="ffprobe"></label><label>ffplay.exe<input id="ffplay"></label><label>Directorio de DLL (avcodec, avformat, avutil… )<input id="dll_dir"></label></div><div class="actions"><button id="auto">🔎 Auto-detectar</button><button id="test">🧪 Probar herramientas</button></div></section>
<section class="card"><h2>Salida MKV</h2><div class="form"><label>Carpeta de salida<input id="output_dir"></label><div class="grid"><label>CRF H.264/H.265<input id="video_crf" type="number" min="0" max="51"></label><label>Preset<select id="video_preset"><option>ultrafast</option><option>superfast</option><option>veryfast</option><option>faster</option><option>fast</option><option selected>medium</option><option>slow</option><option>slower</option></select></label><label>Audio bitrate<input id="audio_bitrate" placeholder="192k"></label><label class="check"><input id="overwrite" type="checkbox"> Sobrescribir si existe</label></div></div></section>
<section class="card"><h2>Red</h2><label>User-Agent<input id="user_agent"></label><label class="check"><input id="reconnect" type="checkbox"> Reintentar automáticamente streams interrumpidos</label></section>
<div class="actions sticky"><button id="openFolder">📂 Abrir carpeta de salida</button><button id="save" class="primary">💾 Guardar configuración</button></div><pre id="log"></pre><p class="note">Esta extensión no evita DRM/Widevine/EME. Está diseñada para medios accesibles normalmente por el navegador y FFmpeg.</p></main><script src="options.js"></script></body></html>
