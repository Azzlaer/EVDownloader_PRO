[FFMPEG]
ffmpeg = C:\bin\ffmpeg.exe
ffprobe = C:\bin\ffprobe.exe
ffplay = C:\bin\ffplay.exe
dll_dir = C:\bin

[OUTPUT]
directory = %USERPROFILE%\Videos\MKV
overwrite = true

[CONVERSION]
video_crf = 22
video_preset = medium
audio_bitrate = 192k

[NETWORK]
user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome Safari/537.36
reconnect = true

[LOG]
file = videomkv_host.log
